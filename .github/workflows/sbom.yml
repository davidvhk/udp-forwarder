name: Generate SBOM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach SBOM to releases
      id-token: write   # needed for dependency graph submission

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate SBOM and submit to Dependency Graph
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: udp-forwarder-sbom.spdx.json
          dependency-snapshot: true

      - name: Scan SBOM with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: sbom
          image-ref: udp-forwarder-sbom.spdx.json
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: echo "TAG=$(cat ./VERSION | tr -d '\r\n')" >> $GITHUB_ENV

      - name: Attach SBOM to GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          files: udp-forwarder-sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM as workflow artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: udp-forwarder-sbom-spdx
          path: udp-forwarder-sbom.spdx.json
