name: Generate SBOM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach SBOM to releases
      id-token: write   # needed for dependency graph submission

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate SBOM and submit to Dependency Graph
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: udp-forwarder-sbom.spdx.json
          dependency-snapshot: true

      - name: Scan SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          image-ref: udp-forwarder-sbom.spdx.json
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach SBOM to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: udp-forwarder-sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM as workflow artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: udp-forwarder-sbom-spdx
          path: udp-forwarder-sbom.spdx.json
